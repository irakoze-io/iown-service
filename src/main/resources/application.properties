spring.threads.virtual.enabled=true

server.port=1443

spring.application.version=0.0.1
spring.application.name="I Own Service Management"

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/nirva?ApplicationName=iown-service
spring.datasource.username=postgres
spring.datasource.password=#{cryptoUtil.decrypt(\"2hu2YGNd2yD1aoylGq1QIe0Q6YaP5fWz9s2sktuzv3A=\")}
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Connection Pooling
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.pool-name=iown-service-pool

# Enable docker compose
spring.docker.compose.enabled=false